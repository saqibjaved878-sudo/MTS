<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTS Business Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--green:#1eb37b;--blue:#378add;--orange:#f59e0b;--purple:#7c3aed;--red:#ef4444;--sidebar:#1a2332;--bg:#f0f2f5;--white:#fff;--border:#e5e7eb;--sidebar-hover:#243049;--text-light:#a0aec0;--text-sidebar:#cbd5e1}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:#fff;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s ease}
.sidebar-brand{padding:20px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .brand-icon{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-nav{padding:12px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;color:var(--text-sidebar);font-size:14px;transition:.2s;border-left:3px solid transparent}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-hover);border-left-color:var(--green);color:#fff}
.nav-item .nav-label{display:flex;flex-direction:column;line-height:1.3}
.nav-item .nav-urdu{font-size:11px;color:var(--text-light)}
.nav-item i{font-size:20px;width:24px;text-align:center}
.main-content{margin-left:240px;flex:1;padding:24px;min-height:100vh;width:calc(100% - 240px)}
.page{display:none}
.page.active{display:block}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:24px;font-weight:700;color:#1a202c}
.page-header .urdu-title{font-size:14px;color:#64748b;font-weight:400}
.card{background:var(--white);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#1a202c}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi-card{padding:16px 20px;border-radius:12px;color:#fff;position:relative;overflow:hidden}
.kpi-card .kpi-value{font-size:28px;font-weight:700;margin-top:4px}
.kpi-card .kpi-label{font-size:13px;opacity:.85}
.kpi-card .kpi-urdu{font-size:11px;opacity:.7;margin-top:2px}
.kpi-card i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:48px;opacity:.15}
.kpi-green{background:linear-gradient(135deg,#1eb37b,#159b67)}
.kpi-blue{background:linear-gradient(135deg,#378add,#2b6cb0)}
.kpi-orange{background:linear-gradient(135deg,#f59e0b,#d97706)}
.kpi-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.kpi-red{background:linear-gradient(135deg,#ef4444,#dc2626)}
.kpi-teal{background:linear-gradient(135deg,#14b8a6,#0d9488)}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{background:#f8fafc;color:#475569;font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table tr:nth-child(even){background:#f8fafc}
table tr:hover{background:#eef2ff}
table tr.row-green{background:#d1fae5!important}
table tr.row-yellow{background:#fef9c3!important}
table tr.row-orange{background:#ffedd5!important}
table tr.row-red{background:#fee2e2!important}
table tr.search-highlight{background:#fef08a!important;box-shadow:inset 0 0 0 2px #eab308}
.table-wrap{overflow-x:auto}
input,select,textarea{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--white);transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(30,179,123,.12)}
textarea{resize:vertical;min-height:50px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#159b67}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#2b6cb0}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#dc2626}
.btn-orange{background:#d97706;color:#fff}
.btn-orange:hover{background:#b45309}
.btn-teal{background:#0d9488;color:#fff}
.btn-teal:hover{background:#0f766e}
.btn-gray{background:#e2e8f0;color:#475569}
.btn-gray:hover{background:#cbd5e1}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;background:transparent;border:none;cursor:pointer;font-size:18px;color:var(--red);border-radius:6px;transition:.2s}
.btn-icon:hover{background:#fee2e2}
.month-selector{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.month-selector select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:500}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.section-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-orange{background:#ffedd5;color:#9a3412}
.badge-red{background:#fee2e2;color:#991b1b}
.empty-state{padding:40px;text-align:center;color:#94a3b8;font-size:15px}
.empty-state i{font-size:48px;margin-bottom:12px;display:block;opacity:.4}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:#64748b;font-size:14px;margin-bottom:20px;line-height:1.6}
.modal-actions{display:flex;gap:12px;justify-content:flex-end}
.toast{position:fixed;bottom:30px;right:30px;background:#1a202c;color:#fff;padding:14px 24px;border-radius:10px;font-size:14px;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(100px);opacity:0;transition:.4s}
.toast.show{transform:translateY(0);opacity:1}
.running-total{font-weight:700;color:var(--green)}
.free-text-input{min-width:100px}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.summary-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.summary-card .label{font-size:12px;color:#64748b;text-transform:uppercase;font-weight:600}
.summary-card .value{font-size:22px;font-weight:700;margin-top:2px}
.summary-card .urdu-label{font-size:11px;color:#94a3b8}
.person-collection{background:#f8fafc;padding:16px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.person-collection-item{padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.person-collection-item .pc-name{font-weight:600;font-size:14px}
.person-collection-item .pc-amount{font-size:18px;font-weight:700;color:var(--green)}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1}
.chart-container{position:relative;height:250px;margin-bottom:16px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-cards-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.mini-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px}
.mini-card .mc-title{font-size:13px;font-weight:600;color:#475569;margin-bottom:8px}
.mini-card .mc-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.progress-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .5s}
.recent-activity{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px}
.ra-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.ra-item:last-child{border-bottom:none}
.ra-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff}
.ra-tag-customer{background:var(--blue)}
.ra-tag-software{background:var(--purple)}
.ra-tag-hardware{background:var(--orange)}
.hamburger{display:none;position:fixed;top:16px;left:16px;z-index:200;background:var(--sidebar);color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:20px}
.boss-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border)}
.boss-tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600;border-radius:8px 8px 0 0;transition:.2s;display:flex;align-items:center;gap:6px;color:#64748b;border:1px solid transparent;border-bottom:none;margin-bottom:-2px}
.boss-tab:hover{background:#f1f5f9;color:#1a202c}
.boss-tab.active{background:var(--white);color:var(--green);border-color:var(--border);border-bottom-color:var(--white)}
.boss-grand-total{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:24px;padding:16px 20px;background:var(--white);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap}
.boss-grand-total .grand-total{font-size:20px;font-weight:700;color:var(--green);padding-left:20px;border-left:2px solid var(--border)}
@keyframes pulse-alert{0%,100%{background:#ef4444;opacity:1}50%{background:#dc2626;opacity:.85}}
.hw-alert-banner{animation:pulse-alert 2s infinite;color:#fff;padding:14px 20px;border-radius:10px;font-size:15px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:12px;cursor:pointer}
@media(max-width:900px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main-content{margin-left:0;width:100%}
.hamburger{display:block}
.grid-2,.grid-3,.grid-4,.charts-row,.mini-cards-row{grid-template-columns:1fr}
.person-collection{grid-template-columns:1fr}
.page-header{flex-direction:column;align-items:flex-start}
}
@media(max-width:600px){
.main-content{padding:16px}
.card{padding:14px}
table{font-size:12px}
table td,table th{padding:6px 8px}
.summary-cards{grid-template-columns:1fr 1fr}
}
@media(max-width:1100px){.emp-cards-grid{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:700px){.emp-cards-grid{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:480px){.emp-cards-grid{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<!-- PASSWORD LOCK SCREEN -->
<div id="lockScreen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a2332,#243049);z-index:9999;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;width:340px;box-shadow:0 30px 80px rgba(0,0,0,0.4);text-align:center">
    <div style="width:70px;height:70px;background:linear-gradient(135deg,#1eb37b,#159b67);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px">🔐</div>
    <div style="font-size:22px;font-weight:800;color:#1a202c;margin-bottom:4px">MTS Business System</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:28px">Password daalen | پاس ورڈ درج کریں</div>
    <input type="password" id="lockInput" placeholder="🔑 Password..." onkeydown="if(event.key==='Enter')checkPassword()" style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:12px;outline:none;transition:.2s" onfocus="this.style.borderColor='#1eb37b'" onblur="this.style.borderColor='#e5e7eb'">
    <div id="lockError" style="color:#ef4444;font-size:13px;font-weight:600;margin-bottom:12px;min-height:20px"></div>
    <button onclick="checkPassword()" style="width:100%;padding:13px;background:linear-gradient(135deg,#1eb37b,#159b67);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s" onmouseover="this.style.opacity='.9'" onmouseout="this.style.opacity='1'">🔓 Unlock System</button>
    <div id="attemptsLeft" style="margin-top:14px;font-size:12px;color:#94a3b8"></div>
  </div>
</div>
<!-- END LOCK SCREEN -->
<button class="hamburger" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="ti ti-chart-line"></i></div>
    <div>MTS Business<span style="display:block;font-size:11px;font-weight:400;color:var(--text-light)">مینجمنٹ سسٹم</span></div>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</div>
<div class="main-content" id="mainContent"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STATE_KEY='mts_business_state';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ISB_AREAS=['I-8','Blue Area','F-8','F-11','F-10','Tarnol','G-13','G-10','F-7','F-6','F-5','F-4','F-3','F-2','F-1','E-7','E-11','Bahria Town ISB','DHA ISB','Gulberg ISB'];
const RWP_AREAS=['Chandni Chowk','Commercial Market','Saddar','Khanapul','Taramari','Alipur','Bahria Town RWP','Gulraiz','Westridge','Chaklala'];
const SOFTWARE_TYPES=['POS System','Billing Software','Inventory Software','Other'];
const PAY_METHODS=['Cash','Easypaisa','Bank Transfer','Online'];
const PERSONS=['SAQIB','AHMED','AMJAD','EHSAN','TAIMOUR','HAMZA','HR MANAGER'];
const EMPLOYEE_LIST=['ALL','SAQIB','AHMED','AMJAD','EHSAN','TAIMOUR','HAMZA','HR MANAGER'];
let selectedEmployee='ALL';
const PAGES=[
  {id:'dashboard',icon:'ti ti-dashboard',label:'Dashboard',urdu:'ڈیش بورڈ'},
  {id:'customers',icon:'ti ti-users',label:'Customers',urdu:'گاہک'},
  {id:'boss',icon:'ti ti-coin',label:'Boss Payments',urdu:'باس کو ادائیگی'},
  {id:'software',icon:'ti ti-code',label:'Software Ledger',urdu:'سافٹ ویئر لیجر'},
  {id:'hardware',icon:'ti ti-device-laptop',label:'Hardware Ledger',urdu:'ہارڈ ویئر لیجر'},
  {id:'food',icon:'ti ti-meat',label:'Food Expense',urdu:'کھانے کے اخراجات'},
  {id:'baraf',icon:'ti ti-snowflake',label:'Baraf (Ice)',urdu:'برف'},
  {id:'chay',icon:'ti ti-coffee',label:'Chay (Aftab)',urdu:'چائے'},
  {id:'employee-advance',icon:'ti ti-wallet',label:'Employee Advance',urdu:'ملازم ایڈوانس'},
  {id:'office-expense',icon:'ti ti-building-store',label:'Office Expense',urdu:'دفتری اخراجات'},
  {id:'monthly-summary',icon:'ti ti-report-analytics',label:'Monthly Summary',urdu:'ماہانہ خلاصہ'},
  {id:'settings',icon:'ti ti-settings',label:'Settings',urdu:'سیٹنگز'}
];
let state=loadState();
let currentPage='dashboard';
let charts={};
// ════════════════════════════════════════════════════════
// PASSWORD LOCK SYSTEM
// ════════════════════════════════════════════════════════
const MAX_ATTEMPTS    = 5;
let   wrongAttempts   = 0;

function getPassword() { return localStorage.getItem('mts_password') || 'mts123'; }
function savePassword(newPass) { localStorage.setItem('mts_password', newPass); }

function checkPassword() {
  const input = document.getElementById('lockInput');
  const error = document.getElementById('lockError');
  const attDiv = document.getElementById('attemptsLeft');
  const entered = input.value.trim();
  if (entered === getPassword()) {
    document.getElementById('lockScreen').style.display = 'none';
    input.value = '';
    error.textContent = '';
    wrongAttempts = 0;
    showToast('✅ System unlock ho gaya!');
    return;
  }
  wrongAttempts++;
  input.value = '';
  input.style.borderColor = '#ef4444';
  setTimeout(() => { input.style.borderColor = '#e5e7eb'; }, 1000);
  const remaining = MAX_ATTEMPTS - wrongAttempts;
  if (wrongAttempts >= MAX_ATTEMPTS) {
    error.textContent = '🚫 Zyada galat attempts! System band ho gaya.';
    error.style.color = '#ef4444';
    attDiv.textContent = 'Page refresh karo dobara try karne ke liye.';
    document.querySelector('button[onclick="checkPassword()"]').disabled = true;
    input.disabled = true;
  } else {
    error.textContent = '❌ Galat password hai!';
    attDiv.textContent = `${remaining} koshish baaki hain`;
  }
}

function lockSystem() {
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockInput').value = '';
  document.getElementById('lockError').textContent = '';
  document.getElementById('attemptsLeft').textContent = '';
  wrongAttempts = 0;
  showToast('🔒 System lock ho gaya');
}

function changePassword() {
  const oldPass = document.getElementById('oldPass').value.trim();
  const newPass = document.getElementById('newPass').value.trim();
  const confirmPass = document.getElementById('confirmPass').value.trim();
  if (oldPass !== getPassword()) { showToast('❌ Purana password galat hai!'); document.getElementById('oldPass').value = ''; return; }
  if (!newPass) { showToast('⚠️ Naya password khali nahi ho sakta!'); return; }
  if (newPass.length < 4) { showToast('⚠️ Password kam az kam 4 characters ka hona chahiye!'); return; }
  if (newPass !== confirmPass) { showToast('❌ Naya password aur confirm password match nahi karte!'); document.getElementById('confirmPass').value = ''; return; }
  savePassword(newPass);
  document.getElementById('oldPass').value = '';
  document.getElementById('newPass').value = '';
  document.getElementById('confirmPass').value = '';
  showToast('✅ Password successfully change ho gaya!');
}

function resetPassword() {
  showModal('⚠️ Password Reset','Password reset karne ke baad naya password <strong>"mts123"</strong> ho jayega.<br><br>کیا آپ واقعی reset کرنا چاہتے ہیں؟','🔁 Haan, Reset Karo',()=>{savePassword('mts123');showToast('✅ Password reset ho gaya! Naya password: mts123');});
}

function loadState(){
  try{
    const d=localStorage.getItem(STATE_KEY);
    if(d) return JSON.parse(d);
  }catch(e){}
  return getDefaultState();
}
function getDefaultState(){
  const d=new Date();
  const m=d.getMonth()+1, y=d.getFullYear();
  const mk=`${y}-${String(m).padStart(2,'0')}`;
  return {
    customers:{},
    softwareLedger:{entries:[]},
    hardwareLedger:{entries:[]},
    bossPayments:{entries:[]},
    foodExpense:{entries:[]},
    baraf:{entries:[]},
    chay:{entries:[]},
    employeeAdvance:{entries:[]},
    officeExpense:{entries:[]},
    currentMonth:mk
  };
}
function saveState(){
  try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){}
}
function manualSave(){saveState();showToast('✅ Data save ho gaya');}
function getMonthKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function ensureMonthData(mk){
  if(!state.customers[mk]) state.customers[mk]={saqib:{openingBalance:0,rows:[]},ahmed:{openingBalance:0,rows:[]}};
}
function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return 'Rs 0';
  return 'Rs '+Number(n).toLocaleString('en-PK');
}
function fmtDate(d){
  const dt=d instanceof Date?d:new Date(d);
  const day=String(dt.getDate()).padStart(2,'0');
  const mon=String(dt.getMonth()+1).padStart(2,'0');
  const yr=dt.getFullYear();
  return `${day}-${mon}-${yr}`;
}
function todayStr(){return fmtDate(new Date())}
function parseDate(str){
  if(!str) return null;
  const p=str.split('-');
  if(p.length!==3) return null;
  return new Date(`${p[1]}-${p[0]}-${p[2]}`);
}
function daysPending(dateStr){
  const d=parseDate(dateStr);
  if(!d) return 0;
  const now=new Date();
  const diff=Math.floor((now-d)/(86400000));
  return diff<0?0:diff;
}
function statusLabel(dp,remaining){
  if(!remaining||remaining<=0) return{text:'✅ Clear',cls:'badge-green'};
  if(dp<=6) return{text:'🟢 New',cls:'badge-green'};
  if(dp<=13) return{text:'🟡 1 Week',cls:'badge-yellow'};
  if(dp<=20) return{text:'🟠 2 Weeks',cls:'badge-orange'};
  return{text:'🔴 Overdue',cls:'badge-red'};
}
function rowClass(dp,remaining){
  if(!remaining||remaining<=0) return'row-green';
  if(dp<=6) return'row-yellow';

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function showModal(title,msg,confirmLabel,onConfirm,isHtml){
  const o=document.getElementById('modalOverlay');
  const c=document.getElementById('modalContent');
  c.innerHTML=`<h3>${title}</h3>${isHtml?msg:'<p>'+msg+'</p>'}<div class="modal-actions"><button class="btn btn-gray" onclick="closeModal()">❌ Cancel</button><button class="btn btn-red" id="modalConfirmBtn">${confirmLabel}</button></div>`;
  o.classList.add('open');
  document.getElementById('modalConfirmBtn').onclick=()=>{closeModal();onConfirm();};
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function init(){
  renderSidebar();
  renderPage('dashboard');
}
function renderSidebar(){
  const nav=document.getElementById('sidebarNav');
  const mainPages=PAGES.filter(p=>p.id!=='settings');
  const sp=PAGES.find(p=>p.id==='settings');
  nav.innerHTML=mainPages.map(p=>`<div class="nav-item${p.id===currentPage?' active':''}" onclick="navigate('${p.id}')"><i class="${p.icon}"></i><div class="nav-label"><span>${p.label}</span><span class="nav-urdu">${p.urdu}</span></div></div>`).join('');
  nav.innerHTML+=`<div style="margin-top:20px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px">

function navigate(pageId){
  if(currentPage===pageId) return;
  currentPage=pageId;
  renderSidebar();
  renderPage(pageId);
  if(window.innerWidth<=900) document.getElementById('sidebar').classList.remove('open');
}
function renderPage(pageId){
  const mc=document.getElementById('mainContent');
  switch(pageId){
    case'dashboard':renderDashboard(mc);break;
    case'customers':renderCustomers(mc);break;
    case'boss':renderBoss(mc);break;
    case'software':renderSoftware(mc);break;
    case'hardware':renderHardware(mc);break;
    case'food':renderFood(mc);break;
    case'baraf':renderBaraf(mc);break;
    case'chay':renderChay(mc);break;
    case'employee-advance':renderEmployeeAdvance(mc);break;

function monthSelectorHTML(){
  const d=new Date();const cy=d.getFullYear();
  let opts='';
  for(let y=cy-1;y<=cy+1;y++){
    for(let m=1;m<=12;m++){
      const mk=`${y}-${String(m).padStart(2,'0')}`;
      const sel=mk===state.currentMonth?'selected':'';
      opts+=`<option value="${mk}" ${sel}>${MONTHS[m-1]}-${y}</option>`;
    }
  }
  return`<select onchange="changeMonth(this.value)">${opts}</select>`;
}

function renderCustomerSection(label,data,key,mk){
  const rows=data.rows||[];

  if(key==='saqib'&&mk){
    const saqibFood=(state.foodExpense.entries||[]).filter(r=>r.person==='SAQIB'&&dateToMonthKey(r.date)===mk).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const barafT=(state.baraf.entries||[]).filter(r=>dateToMonthKey(r.date)===mk).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const bossT=(state.bossPayments.entries||[]).filter(r=>dateToMonthKey(r.date)===mk).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const ded=saqibFood+barafT+bossT;
    advPerRow=total>0?rows.map(r=>{const a=Number(r.amount)||0;return a-(ded*a/total);}):rows.map(r=>Number(r.amount)||0);
    totalAdv=advPerRow.reduce((s,v)=>s+v,0);
  }
  if(key==='ahmed'&&mk){
    const ahmedFood=(state.foodExpense.entries||[]).filter(r=>r.person==='AHMED'&&dateToMonthKey(r.date)===mk).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const bossT=(state.bossPayments.entries||[]).filter(r=>dateToMonthKey(r.date)===mk).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const saqibT=(state.customers[mk]?.saqib?.rows||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const combined=total+saqibT||1;

        <tbody id="custBody_${key}">
          ${rows.map((r,i)=>{
            running+=Number(r.amount)||0;
            return`<tr>
              <td>${i+1}</td>
              <td><input type="text" class="free-text-input" style="width:100px" value="${r.date||todayStr()}" onchange="updateCustField('${key}',${i},'date',this.value)" oninput="updateCustField('${key}',${i},'date',this.value)"></td>
              <td><select style="width:120px" onchange="updateCustField('${key}',${i},'city',this.value);renderCustomersPage()">${['Islamabad','Rawalpindi'].map(c=>`<option value="${c}"${r.city===c?' selected':''}>${c}</option>`).join('')}</select></td>

function renderSoftware(mc){
  const entries=state.softwareLedger.entries||[];
  const totalAmount=entries.reduce((s,e)=>s+(Number(e.totalAmount)||0),0);
  const totalAdvance=entries.reduce((s,e)=>s+(Number(e.advancePaid)||0),0);
  const totalRemaining=entries.reduce((s,e)=>s+(Number(e.remainingReceived)||0),0);
  const totalRemainingAmt=totalAmount-totalAdvance-totalRemaining;
  const overdueCount=entries.filter(e=>{const dp=daysPending(e.date);const rem=(Number(e.totalAmount)||0)-(Number(e.advancePaid)||0)-(Number(e.remainingReceived)||0);return dp>=21&&rem>0;}).length;
  // Person collection
  let colSaqib=0,colAhmed=0,colAmjad=0;
  entries.forEach(e=>{
    const adv=Number(e.advancePaid)||0;
    const rem=Number(e.remainingReceived)||0;
    if(e.advanceBy==='SAQIB') colSaqib+=adv;
    if(e.advanceBy==='AHMED') colAhmed+=adv;
    if(e.advanceBy==='AMJAD') colAmjad+=adv;

const ADV_EMPLOYEES=['SAQIB','AHMED','AMJAD','EHSAN','TAIMOUR','HAMZA','HR MANAGER'];
let advSelectedEmp='ALL';
function getEmployeeBalance(emp){
  const all=state.employeeAdvance.entries||[];
  let bal=0;
  all.filter(r=>r.employee===emp).forEach(r=>{
    if((r.type||'add')==='return'){bal-=Number(r.amount)||0;}else{bal+=Number(r.advance)||0;}
  });
  return bal;
}

//======= MONTHLY SUMMARY =======
function dateToMonthKey(dateStr){
  if(!dateStr) return '';
  const p=dateStr.split('-');
  if(p.length!==3) return '';
  return `${p[2]}-${p[1]}`;
}
function renderMonthlySummary(mc){
  const mk=state.currentMonth;
  ensureMonthData(mk);
  const cd=state.customers[mk];
  const saqibRows=cd.saqib.rows, ahmedRows=cd.ahmed.rows;
  const saqibTotal=saqibRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const ahmedTotal=ahmedRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalMaintenance=saqibTotal+ahmedTotal;

  const bossAll=state.bossPayments.entries||[];
  const bossMonth=bossAll.filter(r=>dateToMonthKey(r.date)===mk);
  const cashBoss=bossMonth.filter(r=>r.method==='Cash').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const easypaisaBoss=bossMonth.filter(r=>r.method==='Easypaisa').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const bankBoss=bossMonth.filter(r=>r.method==='Bank Transfer').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalBoss=cashBoss+easypaisaBoss+bankBoss;

  const foodAll=state.foodExpense.entries||[];
  const foodMonth=foodAll.filter(r=>dateToMonthKey(r.date)===mk);
  const saqibFood=foodMonth.filter(r=>r.person==='SAQIB').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const ahmedFood=foodMonth.filter(r=>r.person==='AHMED').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalFood=saqibFood+ahmedFood;

  const advAll=state.employeeAdvance.entries||[];
  const advMonth=advAll.filter(r=>dateToMonthKey(r.date)===mk);
  const saqibAdvAdd=advMonth.filter(r=>r.employee==='SAQIB'&&(r.type||'add')!=='return').reduce((s,r)=>s+(Number(r.advance)||0),0);
  const saqibAdvRet=advMonth.filter(r=>r.employee==='SAQIB'&&(r.type||'add')==='return').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const saqibAdv=saqibAdvAdd-saqibAdvRet;
  const saqibFoodFromAdv=advMonth.filter(r=>r.employee==='SAQIB').reduce((s,r)=>s+(Number(r.foodExpense)||0),0);
  const ahmedAdv=advMonth.filter(r=>r.employee==='AHMED').reduce((s,r)=>s+(Number(r.advance)||0),0);
  const otherAdv=advMonth.filter(r=>r.employee!=='SAQIB'&&r.employee!=='AHMED').reduce((s,r)=>s+(Number(r.advance)||0),0);
  const totalAdv=saqibAdv+ahmedAdv+otherAdv;

  const officeAll=state.officeExpense.entries||[];
  const officeMonth=officeAll.filter(r=>r.month===mk);
  const totalOffice=officeMonth.reduce((s,r)=>s+(Number(r.amount)||0),0);

  const closingBalance=totalMaintenance-totalBoss-totalFood-totalAdv-totalOffice;
  const balColor=closingBalance>0?'var(--green)':closingBalance<0?'var(--red)':'#94a3b8';
  const balIcon=closingBalance>0?'✅':closingBalance<0?'❌':'';

  const ym=mk.split('-');
  const monthLabel=`${MONTHS[parseInt(ym[1])-1]} ${ym[0]}`;

  const sep='<div style="border-bottom:2px dashed var(--border);margin:12px 0"></div>';

  mc.innerHTML=`
    <div class="page-header"><div><h1>Monthly Summary</h1><span class="urdu-title">ماہانہ خلاصہ</span></div><div class="month-selector">${monthSelectorHTML()}<button class="btn btn-green" onclick="manualSave()"><i class="ti ti-device-floppy"></i> Save</button><button class="btn btn-blue" onclick="exportToExcel('monthly-summary')"><i class="ti ti-file-spreadsheet"></i> Export Excel</button></div></div>
    <div class="card">
      <div style="font-size:18px;font-weight:700;margin-bottom:16px;text-align:center">MONTHLY SUMMARY <span style="color:var(--green)">${monthLabel}</span></div>
      ${sep}
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">1. TOTAL MAINTENANCE COLLECTED</div>
      <div style="padding-left:16px;font-size:14px;line-height:2">

//======= CHARTS =======
function renderBarChart(){
  const canvas=document.getElementById('barChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  if(charts.bar) charts.bar.destroy();
  // Build 12 months data from current year
  const d=new Date();const cy=d.getFullYear();
  const labels=[],saqibData=[],ahmedData=[];
  for(let m=0;m<12;m++){
    const mk=`${cy}-${String(m+1).padStart(2,'0')}`;
    labels.push(MONTHS[m]);
    ensureMonthData(mk);
    const cd=state.customers[mk];
    const sTotal=cd.saqib.rows.reduce((s,r)=>s+(Number(r.amount)||0),0);
    const aTotal=cd.ahmed.rows.reduce((s,r)=>s+(Number(r.amount)||0),0);
    saqibData.push(sTotal);
    ahmedData.push(aTotal);
  }
  charts.bar=new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'SAQIB',data:saqibData,backgroundColor:'rgba(30,179,123,.7)',borderColor:'#1eb37b',borderWidth:1},
        {label:'AHMED',data:ahmedData,backgroundColor:'rgba(55,138,221,.7)',borderColor:'#378add',borderWidth:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{
        y:{beginAtZero:true,ticks:{callback:v=>'Rs '+v.toLocaleString('en-PK')}}
      }
    }
  });
}
function renderDonutChart(boss,food,baraf,chay){

    const row=[];
    for(let i=0;i<data[0].length;i++) row.push(i===0?'TOTAL | \u06A9\u0644':(i===totalIdx?sumVal:''));
    data.push(row);

    const hwE=state.hardwareLedger.entries;
    const swTo=swE.reduce((s,e)=>s+(Number(e.totalAmount)||0),0);
    const swRe=swTo-swE.reduce((s,e)=>s+(Number(e.advancePaid)||0)+(Number(e.remainingReceived)||0),0);
    const hwTo=hwE.reduce((s,e)=>s+(Number(e.totalValue)||0),0);
    const hwBa=hwTo-hwE.reduce((s,e)=>s+(Number(e.received)||0),0);
    const bT=(state.bossPayments.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const nB=tR-bT;
    const fS=(state.foodExpense.entries||[]).filter(r=>r.person==='SAQIB').reduce((s,r)=>s+(Number(r.amount)||0),0);
    const fA=(state.foodExpense.entries||[]).filter(r=>r.person==='AHMED').reduce((s,r)=>s+(Number(r.amount)||0),0);
    const fT=(state.foodExpense.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const baT=(state.baraf.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const cT=(state.chay.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const sNet=sT-fS,aNet=aT-fA;
    const sumD=[['Metric','Value'],['Total Received',tR],['Total Customers',tC],['Boss Ko Diya',bT],['Net Balance',nB],['Software Total',swTo],['Software Remaining',swRe],['Hardware Balance',hwBa],['Total Pending',swRe+hwBa],['SAQIB Balance',sNet],['AHMED Balance',aNet],['Combined Balance',sNet+aNet],['Food Total',fT],['Baraf Total',baT],['Chay Total',cT]];
    const ws1=XLSX.utils.aoa_to_sheet(sumD);
    ws1['!cols']=[{wch:25},{wch:15}];
    XLSX.utils.book_append_sheet(wb,ws1,'Summary');
    const custD=[['Sr#','Date','City','Area','Customer Name','Amount','Person']];
    let allR=[];
    cd.saqib.rows.forEach(r=>allR.push({...r,person:'SAQIB'}));
    cd.ahmed.rows.forEach(r=>allR.push({...r,person:'AHMED'}));
    allR.forEach((r,i)=>custD.push([i+1,r.date,r.city,r.area,r.customerName,Number(r.amount)||0,r.person]));
    addTotalRow(custD,5,sT+aT);
    const ws2=XLSX.utils.aoa_to_sheet(custD);
    ws2['!cols']=[{wch:5},{wch:12},{wch:15},{wch:20},{wch:25},{wch:12},{wch:8}];
    XLSX.utils.book_append_sheet(wb,ws2,'Customers');
    const swD=[['Sr#','Date','Customer Name','Area','Software Type','Total Amount','Advance Paid','Advance By','Advance Method','Remaining Received','Remaining By','Remaining Method','Collection Date','Notes','Balance','Status']];
    swE.forEach((e,i)=>{
      const t=Number(e.totalAmount)||0;const a=Number(e.advancePaid)||0;const r=Number(e.remainingReceived)||0;
      const bal=t-a-r;const st=statusLabel(daysPending(e.date),bal);
      swD.push([i+1,e.date,e.customerName,e.area,e.softwareType,t,a,e.advanceBy,e.advanceMethod,r,e.remainingBy,e.remainingMethod,e.collectionDate,e.notes,bal,st.text]);
    });
    const swToT=swE.reduce((s,e)=>s+(Number(e.totalAmount)||0),0);
    addTotalRow(swD,5,swToT);
    const ws3=XLSX.utils.aoa_to_sheet(swD);
    ws3['!cols']=[{wch:5},{wch:12},{wch:25},{wch:15},{wch:15},{wch:12},{wch:12},{wch:8},{wch:12},{wch:12},{wch:8},{wch:12},{wch:12},{wch:20},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws3,'Software');
    const hwD=[['Sr#','Date','Customer Name','Area','Item Description','Qty','Total Value','Received','Discount','Balance','Person','Payment Method','Notes','Status']];
    hwE.forEach((e,i)=>{
      const v=Number(e.totalValue)||0;const rec=Number(e.received)||0;const dis=Number(e.discount)||0;
      const bal=v-rec-dis;const st=statusLabel(daysPending(e.date),bal);
      hwD.push([i+1,e.date,e.customerName,e.area,e.itemDescription,Number(e.qty)||0,v,rec,dis,bal,e.person,e.paymentMethod,e.notes,st.text]);
    });
    const hwToV=hwE.reduce((s,e)=>s+(Number(e.totalValue)||0),0);
    addTotalRow(hwD,7,hwToV);
    const ws4=XLSX.utils.aoa_to_sheet(hwD);
    ws4['!cols']=[{wch:5},{wch:12},{wch:25},{wch:15},{wch:25},{wch:6},{wch:12},{wch:12},{wch:8},{wch:12},{wch:8},{wch:12},{wch:20},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws4,'Hardware');
    filename=`Dashboard_Summary_${td}.xlsx`;
  }
  XLSX.writeFile(wb,filename);
  showToast('✅ Excel export ho gaya');
}
//======= SETTINGS =======
function backupDatabase(){
  const data=localStorage.getItem(STATE_KEY);
  if(!data){showToast('❌ Koi data nahi mila');return;}
  const today=new Date();
  const dd=String(today.getDate()).padStart(2,'0');
  const mm=String(today.getMonth()+1).padStart(2,'0');
  const yyyy=today.getFullYear();
  const filename=`MTS_Backup_${yyyy}_${mm}_${dd}.json`;
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Backup file download ho gayi: '+filename);
}
function restoreDatabase(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.customers&&!parsed.bossPayments){showToast('❌ Ye valid MTS backup file nahi hai!');return;}
        showModal('⚠️ Restore Confirm','Kya aap sure hain? Aapka current data replace ho jayega.<br><br>کیا آپ کو یقین ہے؟ موجودہ ڈیٹا replace ہو جائے گا۔','✅ Haan, Restore Karo',function(){
          localStorage.setItem(STATE_KEY,JSON.stringify(parsed));
          state=parsed;
          renderPage(currentPage);
          showToast('✅ Data restore ho gaya!');
        });
      }catch(err){showToast('❌ File read karne mein error: '+err.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}
