<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MTS Dashboard</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTS">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f23;color:#fff;min-height:100vh;padding:0 0 80px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:#0f0f23;padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e3a}
.header h1{font-size:17px;color:#4fc3f7;display:flex;align-items:center;gap:6px}
.header .time{font-size:14px;font-weight:700;font-family:monospace;color:#888}
.banner{background:linear-gradient(135deg,#1e3a5f,#2e6da4);margin:8px 12px;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;box-shadow:0 4px 20px rgba(30,58,95,.35);position:relative;overflow:hidden;transform:perspective(800px) rotateX(0deg);transition:transform .3s}
.banner:active{transform:perspective(800px) rotateX(2deg) scale(.98)}
.banner .bg{position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.banner .bg2{position:absolute;bottom:-20px;left:30%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.banner .temp{font-size:30px;font-weight:900;color:#ffdd00;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.banner .desc{opacity:.9;font-size:14px;font-weight:600}
.banner .loc{opacity:.6;font-size:11px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 8px;perspective:1200px}
.kpi{background:linear-gradient(145deg,#1a1a2e,#252545);border-radius:16px;padding:16px 12px;text-align:center;transform:perspective(800px) rotateX(0deg) translateZ(0);transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 15px rgba(0,0,0,.3);position:relative;overflow:hidden}
.kpi:active{transform:perspective(800px) rotateX(3deg) translateZ(20px) scale(.96);box-shadow:0 8px 30px rgba(79,195,247,.2)}
.kpi::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(79,195,247,.05) 0%,transparent 60%);opacity:0;transition:opacity .5s}
.kpi:active::before{opacity:1}
.kpi .num{font-size:24px;font-weight:800;margin:4px 0;text-shadow:0 0 20px rgba(79,195,247,.15);transition:all .3s}
.kpi .lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.kpi.green .num{color:#4caf50}.kpi.orange .num{color:#ff9800}.kpi.red .num{color:#f44336}.kpi.blue .num{color:#4fc3f7}.kpi.purple .num{color:#ce93d8}
.section{padding:0 12px;margin:10px 0}
.section h3{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding:0 4px}
.card{background:linear-gradient(145deg,#1a1a2e,#252545);border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #2a2a3e;transition:background .2s}
.row:active{background:rgba(79,195,247,.05)}
.row:last-child{border-bottom:none}
.row .l{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.row .l .sub{font-size:11px;color:#888;display:block}
.row .r{font-size:14px;font-weight:700;white-space:nowrap}
.row .r.green{color:#4caf50}.row .r.red{color:#f44336}.row .r.orange{color:#ff9800}.row .r.blue{color:#4fc3f7}
.person-card{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:stretch;margin-bottom:10px;transform:perspective(800px) rotateX(0deg);transition:all .3s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.person-card:active{transform:perspective(800px) rotateX(2deg) scale(.98)}
.person-card .info{flex:1}
.person-card .info .name{font-size:16px;font-weight:800;margin-bottom:8px}
.person-card .info .name span{font-size:11px;font-weight:400;color:rgba(255,255,255,.5);margin-left:6px}
.person-card .info .stat{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05)}
.person-card .info .stat:last-of-type{border-bottom:none}
.person-card .info .stat .v{font-weight:700;color:#4fc3f7}
.person-card .badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:10px;font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 8px;perspective:1200px}
.grid-2 .box{background:linear-gradient(145deg,#1a1a2e,#252545);border-radius:14px;padding:16px 12px;text-align:center;transform:perspective(800px) translateZ(0);transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.grid-2 .box:active{transform:perspective(800px) translateZ(15px) scale(.97)}
.grid-2 .box .num{font-size:20px;font-weight:800;margin:2px 0;transition:all .3s}
.grid-2 .box .lbl{font-size:10px;color:#888}
.loading{text-align:center;padding:80px 20px;color:#888}
.loading .sp{width:40px;height:40px;border:3px solid #333;border-top-color:#4fc3f7;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.error{text-align:center;padding:80px 20px;color:#f44336;font-size:14px}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:99;background:#0f0f23;border-top:1px solid #1e1e3a;display:flex;padding:8px 12px;gap:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.bottom-bar .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;transform:perspective(400px) translateZ(0)}
.bottom-bar .btn:active{transform:perspective(400px) translateZ(10px) scale(.95)}
.btn-sync{background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#0f0f23;box-shadow:0 4px 15px rgba(79,195,247,.3)}
.btn-refresh{background:#1a1a2e;color:#4fc3f7;border:1px solid #2a2a3e!important}
.last-upd{text-align:center;font-size:10px;color:#444;padding:8px 0 70px;transition:color .5s}
.adv-alert{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#1a1a2e,#2d1a1a);border:1px solid #5a2a2a;border-radius:12px;margin:8px 12px;padding:8px 0}
.adv-alert div{display:inline-block;animation:scroll 25s linear infinite;font-size:11px;color:#ff8a80;padding:0 16px}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:4px;background:linear-gradient(145deg,#1a1a2e,#252545);border-radius:16px;padding:12px 8px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.summary-grid>div{text-align:center;transform:perspective(400px) translateZ(0);transition:transform .2s}
.summary-grid>div:active{transform:perspective(400px) translateZ(8px)}
.summary-grid .sg-num{font-size:16px;font-weight:800;margin:2px 0}
.summary-grid .sg-lbl{font-size:9px;color:#888}
/* Pull-to-refresh indicator */
.ptr{text-align:center;padding:12px;color:#4fc3f7;font-size:12px;height:50px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .3s;opacity:0}
.ptr.show{opacity:1}
.ptr .sp2{width:16px;height:16px;border:2px solid rgba(79,195,247,.3);border-top-color:#4fc3f7;border-radius:50%;animation:s .6s linear infinite;display:inline-block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.kpi,.person-card,.grid-2 .box,.row{animation:fadeIn .4s ease-out both}
.kpi:nth-child(1){animation-delay:0s}
.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4){animation-delay:.15s}
</style>
</head>
<body>
<div class="header"><h1>📊 MTS Dashboard</h1><span class="time" id="time"></span></div>
<div id="banner"></div>
<div id="ptr" class="ptr"><span class="sp2"></span> Refreshing...</div>
<div id="app"><div class="loading"><div class="sp"></div>Loading...</div></div>
<div class="last-upd" id="update"></div>
<div class="bottom-bar">
  <button class="btn btn-sync" onclick="syncData()">🔄 Sync Data</button>
  <button class="btn btn-refresh" onclick="load()">↻ Refresh</button>
</div>
<script>
const API = window.location.origin + '/api';
const KEY = 'mts_business_state';
const V = 'v3.0';

function fmt(n){n=Number(n||0);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmt2(n){return fmt(Math.round(Number(n||0)))}
function now(){const d=new Date();return d.toLocaleString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
function today(){const d=new Date();const m=d.toLocaleString(undefined,{month:'short'});return d.getDate()+' '+m+' '+d.getFullYear()}

function showStatus(msg,ok){
  const u=document.getElementById('update');
  u.textContent=msg;
  u.style.color=ok?'#4caf50':'#f44336';
  setTimeout(()=>{u.style.color='#444';},4000);
}

async function load(){
  document.getElementById('time').textContent=now()+' | '+today();
  try{
    const r=await fetch(API+'/storage/'+KEY+'?defaultValue=');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const raw=await r.text();
    const d=JSON.parse(raw||'{}');
    render(d);
    showStatus('✅ Updated: '+new Date().toLocaleTimeString(),true);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="error">⚠️ Data load nahi ho sakaa<p style="font-size:12px;color:#888;margin-top:6px">'+e.message+'</p></div>';
    showStatus('❌ Error: '+e.message,false);
  }
}

function syncData(){
  showStatus('🔄 Syncing...',true);
  document.getElementById('ptr').classList.add('show');
  load();
  setTimeout(()=>document.getElementById('ptr').classList.remove('show'),2000);
}

function render(d){
  const cmk=d.currentMonth||'2026-06';
  ensureMonth(d,cmk);
  const cd=(d.customers||{})[cmk]||{};
  const saqibRows=cd.saqib&&cd.saqib.rows?cd.saqib.rows:[];
  const ahmedRows=cd.ahmed&&cd.ahmed.rows?cd.ahmed.rows:[];
  const saqibMaint=saqibRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const ahmedMaint=ahmedRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalReceived=saqibMaint+ahmedMaint;

  const swEntries=d.softwareLedger&&d.softwareLedger.entries?d.softwareLedger.entries:[];
  const hwEntries=d.hardwareLedger&&d.hardwareLedger.entries?d.hardwareLedger.entries:[];
  const swTotal=swEntries.reduce((s,e)=>s+(Number(e.totalAmount)||0),0);
  const swRecv=swEntries.reduce((s,e)=>s+(Number(e.advancePaid)||0)+(Number(e.remainingReceived)||0),0);
  const swRem=swTotal-swRecv;
  const hwTotal=hwEntries.reduce((s,e)=>s+(Number(e.totalValue)||0),0);
  const hwRecv=hwEntries.reduce((s,e)=>s+(Number(e.received)||0),0);
  const hwBal=hwTotal-hwRecv;

  const boss=(d.bossPayments&&d.bossPayments.entries)||[];
  const bossTotal=boss.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const bossSaqib=boss.filter(e=>(e.givenBy||'SAQIB')==='SAQIB').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const bossAhmed=boss.filter(e=>e.givenBy==='AHMED').reduce((s,e)=>s+(Number(e.amount)||0),0);

  const food=(d.foodExpense&&d.foodExpense.entries)||[];
  const foodTotal=food.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const foodSaqib=food.filter(r=>r.person==='SAQIB').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const foodAhmed=food.filter(r=>r.person==='AHMED').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const barafTotal=(d.baraf&&d.baraf.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const chayTotal=(d.chay&&d.chay.entries||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);

  const saqibDiff=saqibMaint-bossSaqib-(foodTotal/2);
  const ahmedDiff=ahmedMaint-bossAhmed;
  const saqibAutoAdv=saqibMaint-bossSaqib-(foodTotal/2);
  const ahmedAutoAdv=ahmedMaint-bossAhmed;
  const saqibReceivable=(bossSaqib>=saqibMaint)?(foodTotal/2):0;
  const ahmedReceivable=(ahmedDiff<=0)?foodAhmed:0;

  const reg=d.customerRegistry||[];
  let pc=0,tc=0;
  [...saqibRows,...ahmedRows].forEach(r=>{const a=Number(r.amount)||0;if(a>0){pc++;tc+=a;}});
  const matched={};
  [...saqibRows,...ahmedRows].forEach(r=>{const n=(r.customerName||'').toLowerCase().trim();if(n&&Number(r.amount)>0)matched[n]=true;});
  let uc=0,to=0;
  reg.forEach(c=>{const n=(c.customerName||'').toLowerCase().trim();if(!matched[n]){uc++;to+=Number(c.monthlyCharges||0);}});

  const adv=(d.employeeAdvance&&d.employeeAdvance.entries)||[];
  const saqibAdv=adv.filter(r=>r.employee==='SAQIB').reduce((s,r)=>s+(Number(r.advance)||0),0);
  const ahmedAdv=adv.filter(r=>r.employee==='AHMED').reduce((s,r)=>s+(Number(r.advance)||0),0);

  const advEmps={};
  adv.forEach(r=>{const e=r.employee;if(e){advEmps[e]=(advEmps[e]||0)+(Number(r.advance)||0)-(Number(r.totalCollected)||0)-(Number(r.givenToBoss)||0);}});
  const advAlerts=Object.entries(advEmps).filter(([k,v])=>v>0).map(([k,v])=>`⚠️ ${k}: Rs ${fmt(v)} baaki`).join(' | ');

  document.getElementById('app').innerHTML=`
    <div style="text-align:center;font-size:10px;color:#444;padding:4px 0 6px">${V} · ${cmk} · ${saqibRows.length+ahmedRows.length} entries</div>
    <div class="kpis">
      <div class="kpi green"><div class="lbl">Total Received</div><div class="num">${fmt(totalReceived)}</div><div class="lbl">کل وصولی</div></div>
      <div class="kpi orange"><div class="lbl">Boss Ko Diya</div><div class="num">${fmt(bossTotal)}</div><div class="lbl">باس کو دیا</div></div>
      <div class="kpi red"><div class="lbl">SAQIB Balance</div><div class="num">${fmt2(saqibAutoAdv)}</div></div>
      <div class="kpi blue"><div class="lbl">AHMED Balance</div><div class="num">${fmt2(ahmedAutoAdv)}</div></div>
    </div>
    <div class="section"><h3>📋 Customer Maintenance Summary</h3>
      <div class="summary-grid">
        <div><div class="sg-num" style="color:#4fc3f7">${reg.length}</div><div class="sg-lbl">Total</div></div>
        <div><div class="sg-num" style="color:#4caf50">${pc}</div><div class="sg-lbl">Paid</div></div>
        <div><div class="sg-num" style="color:#f44336">${uc}</div><div class="sg-lbl">Pending</div></div>
        <div><div class="sg-num" style="color:#4caf50;font-size:14px">${fmt(tc)}</div><div class="sg-lbl">Collected</div></div>
        <div><div class="sg-num" style="color:#f44336;font-size:14px">${fmt(to)}</div><div class="sg-lbl">Outstanding</div></div>
      </div>
    </div>
    <div class="section"><h3>👥 SAQIB &amp; AHMED Status</h3>
      <div class="person-card" style="background:${saqibAutoAdv>0?'linear-gradient(135deg,#3d1a1a,rgba(244,67,54,.15))':'linear-gradient(135deg,#1a3d1a,rgba(76,175,80,.15))'}">
        <div class="info">
          <div class="name">👑 SAQIB <span>ساقب</span></div>
          <div class="stat"><span>Maintenance</span><span class="v">${fmt(saqibMaint)}</span></div>
          <div class="stat"><span>Boss Ko Diya</span><span class="v">${fmt(bossSaqib)}</span></div>
          <div class="stat"><span>Difference</span><span class="v" style="color:${saqibDiff>0?'#fde68a':'#fff'}">${fmt2(saqibDiff)}</span></div>
          <div class="stat"><span>Food Expense (Total)</span><span class="v">${fmt(foodTotal)}</span></div>
          ${saqibReceivable>0?`<div style="background:rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:11px;display:flex;justify-content:space-between"><span>💰 Boss Sy Lena Hy</span><span style="font-weight:800">${fmt2(saqibReceivable)}</span></div>`:''}
          <div style="margin-top:6px"><span class="badge" style="background:${saqibAutoAdv>0?'#ef4444':'#4caf50'};color:#fff">${saqibAutoAdv>0?'⚠️ Pending':'✅ Settled'}</span></div>
        </div>
      </div>
      <div class="person-card" style="background:${ahmedAutoAdv>0?'linear-gradient(135deg,#3d2a1a,rgba(255,152,0,.12))':'linear-gradient(135deg,#1a2a3d,rgba(79,195,247,.12))'}">
        <div class="info">
          <div class="name">👤 AHMED <span>احمد</span></div>
          <div class="stat"><span>Maintenance</span><span class="v">${fmt(ahmedMaint)}</span></div>
          <div class="stat"><span>Boss Ko Diya</span><span class="v">${fmt(bossAhmed)}</span></div>
          <div class="stat"><span>Difference</span><span class="v" style="color:${ahmedDiff>0?'#fde68a':'#fff'}">${fmt2(ahmedDiff)}</span></div>
          <div class="stat"><span>Food Expense</span><span class="v">${fmt(foodAhmed)}</span></div>
          ${ahmedReceivable>0?`<div style="background:rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:11px;display:flex;justify-content:space-between"><span>💰 Boss Sy Lena Hy</span><span style="font-weight:800">${fmt2(ahmedReceivable)}</span></div>`:''}
          <div style="margin-top:6px"><span class="badge" style="background:${ahmedAutoAdv>0?'#f59e0b':'#4caf50'};color:#fff">${ahmedAutoAdv>0?'⚠️ Pending':'✅ Settled'}</span></div>
        </div>
      </div>
    </div>
    <div class="section"><h3>💻 Software &amp; Hardware</h3>
      <div class="grid-2">
        <div class="box"><div class="lbl">Software Total</div><div class="num" style="color:#26a69a">${fmt(swTotal)}</div></div>
        <div class="box"><div class="lbl">Software Remaining</div><div class="num" style="color:#f44336">${fmt(swRem)}</div></div>
        <div class="box"><div class="lbl">Hardware Balance</div><div class="num" style="color:#ff9800">${fmt(hwBal)}</div></div>
        <div class="box"><div class="lbl">Total Pending</div><div class="num" style="color:#f44336">${fmt(swRem+hwBal)}</div></div>
      </div>
    </div>
    <div class="section"><h3>💰 Outstanding Advances</h3>
      <div class="grid-2">
        <div class="box" style="background:${saqibAdv>0?'linear-gradient(135deg,#3d1a1a,rgba(244,67,54,.12))':'linear-gradient(135deg,#1a3d1a,rgba(76,175,80,.12))'}"><div class="lbl">👑 SAQIB</div><div class="num" style="color:${saqibAdv>0?'#f44336':'#4caf50'}">${fmt(saqibAdv)}</div><div class="lbl">${saqibAdv>0?'⚠️ Baaki':'✅ Clear'}</div></div>
        <div class="box" style="background:${ahmedAdv>0?'linear-gradient(135deg,#3d2a1a,rgba(255,152,0,.12))':'linear-gradient(135deg,#1a2a3d,rgba(79,195,247,.12))'}"><div class="lbl">👤 AHMED</div><div class="num" style="color:${ahmedAdv>0?'#ff9800':'#4caf50'}">${fmt(ahmedAdv)}</div><div class="lbl">${ahmedAdv>0?'⚠️ Baaki':'✅ Clear'}</div></div>
      </div>
    </div>
    ${advAlerts?`<div class="adv-alert"><div>${advAlerts}</div></div>`:''}
    <div class="section"><h3>📊 Expenses (Current Month)</h3>
      <div class="card">
        <div class="row"><div class="l">💰 Boss Ko Diya (Total)</div><div class="r">${fmt(bossTotal)}</div></div>
        <div class="row"><div class="l" style="padding-left:16px">👑 SAQIB ne diya</div><div class="r green">${fmt(bossSaqib)}</div></div>
        <div class="row"><div class="l" style="padding-left:16px">👤 AHMED ne diya</div><div class="r blue">${fmt(bossAhmed)}</div></div>
        <div class="row"><div class="l">🍽️ Food Expense</div><div class="r">${fmt(foodTotal)}</div></div>
        <div class="row"><div class="l">🧊 Baraf (Ice)</div><div class="r">${fmt(barafTotal)}</div></div>
        <div class="row"><div class="l">☕ Chay (Aftab)</div><div class="r">${fmt(chayTotal)}</div></div>
      </div>
    </div>
    <div class="section"><h3>📈 Person Totals</h3>
      <div class="card">
        <div class="row"><div class="l">👑 SAQIB (Maintenance)</div><div class="r green">${fmt(saqibMaint)}</div></div>
        <div class="row"><div class="l" style="padding-left:16px">↳ Advance Baaki</div><div class="r red">${fmt(saqibAdv)}</div></div>
        <div class="row"><div class="l">👤 AHMED (Maintenance)</div><div class="r blue">${fmt(ahmedMaint)}</div></div>
        <div class="row"><div class="l" style="padding-left:16px">↳ Advance Baaki</div><div class="r orange">${fmt(ahmedAdv)}</div></div>
        <div class="row"><div class="l">☕ AFTAB (Chay)</div><div class="r">${fmt(chayTotal)}</div></div>
      </div>
    </div>
  `;
  // Re-trigger pull-to-refresh hide
  document.getElementById('ptr').classList.remove('show');
}

function ensureMonth(d,mk){
  if(!d.customers)d.customers={};
  if(!d.customers[mk])d.customers[mk]={};
  ['saqib','ahmed'].forEach(k=>{if(!d.customers[mk][k])d.customers[mk][k]={rows:[]};});
}

      b.innerHTML=`<div class="banner"><div class="bg"></div><div class="bg2"></div><span class="temp">${t}°C</span><div><div class="desc">${emoji} ${['Clear','Mainly Clear','Partly Cloudy','Overcast','Foggy','Drizzle','Rain','Snow','Thunderstorm'][Math.floor(w/10)]||''}</div><div class="loc">📍 Islamabad, Pakistan</div></div></div>`;

})();

// Pull-to-refresh: scroll-to-top gesture
(function(){
  let startY=0,diff=0,touchId=null;
  document.addEventListener('touchstart',e=>{
    if(window.scrollY>0||e.touches.length>1){touchId=null;return;}
    touchId=e.changedTouches[0].identifier;startY=e.changedTouches[0].screenY;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(touchId===null)return;
    const t=Array.from(e.changedTouches).find(t=>t.identifier===touchId);
    if(!t)return;
    diff=t.screenY-startY;
    if(diff>100&&window.scrollY<=0){
      touchId=null;diff=0;
      document.getElementById('ptr').classList.add('show');
      syncData();
    }
  },{passive:true});
  document.addEventListener('touchend',()=>{touchId=null;},{passive:true});
})();
